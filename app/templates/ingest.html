<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>PDF RAG - Ingestion</title>
    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div>
                <h1>PDF RAG</h1>
                <p>
                    Document Ingestion
                </p>
            </div>
            <div class="user-info">
                Logged in as:
                <strong>
                    {{ current_user.username }}
                </strong>
                |
                Role:
                <strong>
                    {{ current_user.role }}
                </strong>
            </div>
        </div>
        <hr>
        <nav class="navigation">
            <a href="/query">
                Query
            </a>
            <a href="/ingest">
                Ingest
            </a>
            {% if current_user.role == "admin" %}
                <a href="/admin">
                    Admin
                </a>
            {% endif %}
        </nav>
        <hr>
        <section>
            <h2>Ingest PDF</h2>
            <p>
                Select a PDF document to add it to the RAG knowledge base.
            </p>
            <input
                type="file"
                id="pdfFile"
                accept=".pdf,application/pdf"
            >
            <br>
            <button id="ingestButton">
                Ingest
            </button>
            <div id="ingestStatus">
                No file selected.
            </div>
        </section>
        <hr>
        <form
            action="/api/auth/logout"
            method="post"
        >
            <button type="submit">
                Logout
            </button>
        </form>
    </div>
    <script src="/static/ingest.js"></script>
</body>
</html>
